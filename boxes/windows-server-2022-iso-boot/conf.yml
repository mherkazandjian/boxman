# An unattended Windows Server 2022 (Server Core, evaluation) guest.
#
# `os: windows` on an ISO-boot VM makes boxman install it unattended: it
# renders its own answer file (src/boxman/assets/windows/autounattend.xml.j2)
# and puts it on an answer ISO with its setup script (boxman-setup.ps1) and
# the cluster's public key. Setup sees that ISO, virtio-win and the Windows
# ISO on its first boot; all three are install-only, and the first
# `boxman up` or `boxman update` after the install ejects them (G7). See
# doc/windows-guests.md.
#
# The Administrator password comes from the environment and goes into the
# answer ISO only, which boxman writes 0600 into the workspace and removes
# once it is ejected, or with the VM:
#
#   BOXMAN_WIN_ADMIN_PASS='...' boxman up
#
# Media and licensing: the ISO below is Microsoft's 180-day *evaluation*,
# licensed for test and demonstration only. boxman downloads it from
# Microsoft into the local cache; do not republish it, or a disk installed
# from it, to a registry. virtio-win comes from the host's virtio-win RPM
# (dnf install virtio-win), not from this file.
#
version: '1.0'
project: boxman_dev_windows-server-2022-iso-boot

provider:
  libvirt:
    uri: qemu:///system
    use_sudo: true
    virt_install_cmd: '/bin/python3 /usr/bin/virt-install'
    virt_clone_cmd: '/bin/python3 /usr/bin/virt-clone'
    virsh_cmd: '/usr/bin/virsh'

isos:
  winsrv2022-eval:
    # Windows Server 2022 evaluation, en-US, build 20348.587, 5,044,094,976
    # bytes. Resolved from the Evaluation Center link
    # https://go.microsoft.com/fwlink/?linkid=2195280&clcid=0x409&culture=en-us&country=us
    # (pinned to its target so the cache key and checksum stay stable).
    # Microsoft publishes no checksum for it: this sha256 was computed on the
    # first download (2026-10-09), i.e. trust on first use.
    uri: https://software-static.download.prss.microsoft.com/sg/download/888969d5-f34g-4e03-ac9d-1f9786c66749/SERVER_EVAL_x64FRE_en-us.iso
    checksum: sha256:3e4fa6d8507b554856fc9ca6079cc402df11a8b79344871669f0251535255325

workspace:
  path: ~/workspaces/windows-server-2022-iso-boot

clusters:
  win:
    workdir: ~/workspaces/windows-server-2022-iso-boot
    networks:
      win-net:
        mode: nat
        bridge:
          stp: 'on'
          delay: '0'
        mac: '52:54:00:00:99:01'
        ip:
          address: '192.168.153.1'
          netmask: '255.255.255.0'
          dhcp:
            range:
              start: '192.168.153.2'
              end: '192.168.153.254'
        enable: True
        autostart: True
    vms:
      win01:
        # ssh user Administrator, key from the answer ISO, inventory shell
        # powershell, no cloud-init, no clone identity pass
        os: windows
        # 8+ characters, 3 of upper/lower/digit/symbol, or boxman refuses it
        # before anything is built (Windows would stop at OOBE). Set it for
        # the up that creates the VM; later commands do not need it.
        admin_pass: '{{ env("BOXMAN_WIN_ADMIN_PASS") }}'
        vcpus: 2
        memory: 4096
        # A first entry of `cdrom` only selects boxman's ISO-boot path
        # (IsoBootVM). The firmware order that path sets is always hd,cdrom
        # (iso_boot_vm.py): the empty disk falls through to the CD-ROM, and
        # after Setup's first reboot the installed disk boots, not Setup again.
        boot_order: [cdrom, hd]
        disk_size: 40G
        # virt-install's own detection reads this 2022 ISO as win2k25 with
        # some osinfo-db versions (G4)
        os_variant: win2k22
        networks:
          - name: win-net
        # install_only: given to virt-install with the rest, so Setup sees
        # it on its first boot, and ejected by the first `boxman up` or
        # `boxman update` that finds the installed system's guest agent
        # answering -- boxman-setup.ps1 installs the agent once it has read
        # everything it needs off them. `boxman update` never compares an
        # install-only medium: it neither puts one back nor detaches one
        # mid-install. The answer ISO is a third entry, which boxman adds.
        cdroms:
          - name: winsrv2022-eval
            install_only: true
          # The host's virtio-win RPM, used in place (no download, no
          # cache): WinPE loads viostor and NetKVM from it, boxman-setup.ps1
          # the rest.
          - name: virtio-win
            source: /usr/share/virtio-win/virtio-win.iso
            install_only: true
        # boxman's answer file and setup script, Standard Core (image 1 of
        # the evaluation ISO). To use your own, paths relative to this file:
        # unattend:
        #   template: ./autounattend.xml.j2   # Jinja, with conf.yml's env()
        #   files: [./boxman-setup.ps1]       # copied onto the answer ISO
        #   image_index: 2                    # Desktop Experience
        #   vars: {timezone: W. Europe Standard Time}
