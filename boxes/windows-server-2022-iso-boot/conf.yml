# Proof of concept: an unattended Windows Server 2022 guest.
#
# A spike, not a finished box. It uses boxman's ISO-boot path
# (boot_order: [cdrom, hd] -> IsoBootVM -> virt-install), which hands every
# cdroms: entry to virt-install, and works around the remaining gaps with
# virt_install_extra_args -- see doc/windows-guests.md for why each is there
# and what a proper `os: windows` box would look like instead.
#
# Before `boxman up`, build the answer ISO (it holds the Administrator
# password, so it is generated, never committed):
#
#   BOXMAN_WIN_ADMIN_PASS='...' ./make-answer-iso.sh
#
# Media and licensing: the ISO below is Microsoft's 180-day *evaluation*,
# licensed for test and demonstration only. boxman downloads it from
# Microsoft into the local cache; do not republish it, or a disk installed
# from it, to a registry. virtio-win comes from the host's virtio-win RPM
# (dnf install virtio-win), not from this file.
#
version: '1.0'
project: boxman_dev_windows-server-2022-iso-boot

provider:
  libvirt:
    uri: qemu:///system
    use_sudo: true
    virt_install_cmd: '/bin/python3 /usr/bin/virt-install'
    virt_clone_cmd: '/bin/python3 /usr/bin/virt-clone'
    virsh_cmd: '/usr/bin/virsh'

isos:
  winsrv2022-eval:
    # Windows Server 2022 evaluation, en-US, build 20348.587, 5,044,094,976
    # bytes. Resolved from the Evaluation Center link
    # https://go.microsoft.com/fwlink/?linkid=2195280&clcid=0x409&culture=en-us&country=us
    # (pinned to its target so the cache key and checksum stay stable).
    # Microsoft publishes no checksum for it: this sha256 was computed on the
    # first download (2026-10-09), i.e. trust on first use.
    uri: https://software-static.download.prss.microsoft.com/sg/download/888969d5-f34g-4e03-ac9d-1f9786c66749/SERVER_EVAL_x64FRE_en-us.iso
    checksum: sha256:3e4fa6d8507b554856fc9ca6079cc402df11a8b79344871669f0251535255325

workspace:
  path: ~/workspaces/windows-server-2022-iso-boot

clusters:
  win:
    workdir: ~/workspaces/windows-server-2022-iso-boot
    networks:
      win-net:
        mode: nat
        bridge:
          stp: 'on'
          delay: '0'
        mac: '52:54:00:00:99:01'
        ip:
          address: '192.168.153.1'
          netmask: '255.255.255.0'
          dhcp:
            range:
              start: '192.168.153.2'
              end: '192.168.153.254'
        enable: True
        autostart: True
    vms:
      win01:
        vcpus: 2
        memory: 4096
        # A first entry of `cdrom` only selects boxman's ISO-boot path
        # (IsoBootVM). The firmware order that path sets is always hd,cdrom
        # (iso_boot_vm.py): the empty disk falls through to the CD-ROM, and
        # after Setup's first reboot the installed disk boots, not Setup again.
        boot_order: [cdrom, hd]
        disk_size: 40G
        networks:
          - name: win-net
        cdroms:
          - name: winsrv2022-eval
          # The host's virtio-win RPM, used in place (no download, no
          # cache): WinPE loads viostor and NetKVM from it, boxman-setup.ps1
          # the rest. Declared, so `boxman update` leaves it attached.
          - name: virtio-win
            source: /usr/share/virtio-win/virtio-win.iso
        # The answer ISO is not a cdroms: entry: it holds the password and is
        # ejected after setup, and `boxman update` would put a declared one
        # back. As a raw --disk it still reaches Setup's first boot.
        virt_install_extra_args:
          # IsoBootVM passes --os-variant=detect=on, which takes this 2022
          # media for win2k25; a later --os-variant wins.
          - '--os-variant=win2k22'
          - '--disk=path={{ env("HOME") }}/workspaces/windows-server-2022-iso-boot/answer.iso,device=cdrom,readonly=on'
          # boxman runs virt-install with --wait=0, which returns while the
          # install-phase domain (on_reboot=destroy) is still running, so the
          # VM stayed off after Setup's first reboot (G2). A later --wait wins:
          # virt-install then waits for that stop and boots the installed
          # disk itself. `boxman up` blocks until then, for at most 30
          # minutes (the install phase takes about 1.5): if Setup stalls,
          # virt-install gives up, `boxman up` fails, and the domain is left
          # running so its VNC console shows where Setup stopped.
          - '--wait=30'
